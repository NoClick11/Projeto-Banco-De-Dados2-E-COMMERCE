services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: vendas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vendas"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/vendas
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8081:8080"
    volumes:
      - ./sql:/app/sql
    stdin_open: true
    tty: true
    command: ["api"]

volumes:
  pgdata:
